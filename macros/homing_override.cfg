#
# Sensorless homing
#

[gcode_macro _HOME_X]
gcode:
    {% set RUN_CURRENT_X = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set RUN_CURRENT_Y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
    {% set HOME_CURRENT = 0.49 %}

    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CURRENT}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CURRENT}
    
    SET_KINEMATIC_POSITION X=15 SET_HOMED=X   # SET_HOMED defaults to XYZ
    G91
    G1 X-15 F1200   # Move away
    G4 P2000        # 2 second pause
    G28 X           # Home
    G91
    G1 X-15 F1200   # Move away
    
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}

[gcode_macro _HOME_Y]
gcode:
    {% set RUN_CURRENT_X = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set RUN_CURRENT_Y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
    {% set HOME_CURRENT = 0.49 %}

    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CURRENT}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CURRENT}
    
    SET_KINEMATIC_POSITION Y=15 SET_HOMED=Y   # SET_HOMED defaults to XYZ
    G91
    G1 Y-15 F1200   # Move away
    G4 P2000        # 2 second pause
    G28 Y           # Home
    G91
    G1 Y-15 F1200   # Move away

    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}

[homing_override]
axes: xyz
gcode:
  {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
  # Remember the caller's positioning mode; _HOME_X/_HOME_Y switch to G91.
  # (Not SAVE/RESTORE_GCODE_STATE: restoring after homing would resurrect
  # any pre-home G92 offsets.)
  {% set was_absolute = printer.gcode_move.absolute_coordinates %}
  {% set z_was_homed = 'z' in printer.toolhead.homed_axes %}
  {% set homing_z = home_all or 'Z' in params %}

  STATUS_HOMING

  # Lift the nozzle off the bed before moving X/Y. If Z isn't homed, pretend
  # it's at Z=1 (marking only Z as homed) so the lift is allowed.
  G90
  {% if not z_was_homed %}
    SET_KINEMATIC_POSITION Z=1 SET_HOMED=Z
    G1 Z4 F1200
  {% elif printer.toolhead.position.z < 4 %}
    G1 Z4 F1200
  {% endif %}

  {% if home_all or 'X' in params %}
    _HOME_X
  {% endif %}
  
  {% if home_all or 'Y' in params %}
    _HOME_Y
  {% endif %}
  
  {% if homing_z %}
    G90
    G1 X150 Y150 F15000    # Center of bed for Voron Tap
    G28 Z
    G1 Z10 F1500
  {% elif not z_was_homed %}
    # Z was only faked for the lift above; don't leave it marked as homed.
    SET_KINEMATIC_POSITION SET_HOMED=Z CLEAR_HOMED=Z
  {% endif %}

  {% if was_absolute %}
    G90
  {% else %}
    G91
  {% endif %}

  STATUS_READY

[gcode_macro _CG28]
description: Homing only if necessary
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    M117 Homing XYZ axes...
    G28
  {% endif %}

