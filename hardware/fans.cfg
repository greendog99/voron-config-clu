#
# Fans
#

# Controller fan rear - FAN2
[controller_fan controller_fan_rear]
pin: FAN2
kick_start_time: 0.5
heater: heater_bed
fan_speed: 0.33
idle_timeout: 300
idle_speed: 0.25

# Controller fan front - FAN3
[controller_fan controller_fan_front]
pin: FAN3
kick_start_time: 0.5
heater: heater_bed
fan_speed: 0.33
idle_timeout: 300
idle_speed: 0.25

