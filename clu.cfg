[mcu]
canbus_uuid: 2bbf5fe7e0e3

[printer]
kinematics: corexy
max_velocity: 400
max_accel: 3200
max_z_velocity: 20
max_z_accel: 350
square_corner_velocity: 10.0

[idle_timeout]
timeout: 1200    # seconds
gcode:
  RESPOND MSG="Idle timeout reached."
  TURN_OFF_HEATERS
  BED_MESH_CLEAR
  M84

# [force_move] is enabled in AFC/AFC_Hardware.cfg (also needed by homing_override).
# [respond], [pause_resume] and [display_status] come from mainsail.cfg.

[exclude_object]

[gcode_arcs]
resolution: 0.1
